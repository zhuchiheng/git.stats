name: Build VSIX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # NOTE: do NOT pass --no-dependencies. webpack leaves chart.js / moment /
      # simple-git as externals, and the webview loads
      # node_modules/chart.js/dist/chart.umd.js at runtime, so vsce must ship
      # every package listed under "dependencies".
      - name: Read version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx vsce package -o "git-stats-plus-${{ steps.pkg.outputs.version }}.vsix"

      - name: Upload VSIX to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: git-stats-plus-${{ steps.pkg.outputs.version }}.vsix

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: git-stats-plus-${{ steps.pkg.outputs.version }}
          path: git-stats-plus-${{ steps.pkg.outputs.version }}.vsix
