name: Build VSIX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run package

      - name: Package VSIX
        run: npx vsce package --no-dependencies -o git-stats-plus-${{ github.ref_name }}.vsix

      - name: Upload VSIX to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: git-stats-plus-${{ github.ref_name }}.vsix

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: git-stats-plus-${{ github.ref_name }}
          path: git-stats-plus-${{ github.ref_name }}.vsix
